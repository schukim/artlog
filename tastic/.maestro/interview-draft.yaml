# 플로우 3 — 인터뷰 도중 이탈했다가 이어서 쓰기.
# 오늘 clearDraft 시점을 옮겼기 때문에(인터뷰 완료 → 평론 저장 성공),
# 이 경로가 의도대로 남아 있는지 확인한다.
appId: com.taewoo.tastic
---
- launchApp:
    clearState: true
- runFlow: login.yaml
- runFlow:
    file: interview.yaml
    env:
      TITLE: "기생충"
      ANSWERS_COUNT: 2

# 답변 2개만 하고 닫기 → 이탈 확인 다이얼로그
- tapOn:
    id: "interview-close-button"
- extendedWaitUntil:
    visible:
      id: "interview-exit-save"
    timeout: 15000
- tapOn:
    id: "interview-exit-save"

# 인터뷰를 나가면 홈이 아니라 '작품 확인' 화면으로 돌아온다 —
# 스택이 홈 → 작품확인 → 인터뷰라 goBack 이 한 단계만 pop 하기 때문이다.
# (UX 관점에서는 '저장하고 나가기'가 홈까지 가는 게 맞아 보이지만, 지금 동작은 이렇다.)
- extendedWaitUntil:
    visible:
      id: "content-confirm-screen"
    timeout: 20000

# 홈까지 한 번 더 뒤로. iOS 가장자리 스와이프는 이 스택에서 먹지 않아(실측),
# 이미 선택된 평론 탭을 다시 눌러 스택을 최상단으로 되돌린다.
- tapOn:
    id: "tab-review"

# 홈에 '진행 중인 인터뷰' 배너
- extendedWaitUntil:
    visible:
      id: "review-home-screen"
    timeout: 30000
- assertVisible:
    id: "draft-banner"

# 이어서 하기 → 인터뷰가 복원된다(답변이 남아 있어 처음부터 다시 하지 않는다)
- tapOn:
    id: "draft-continue-button"
- extendedWaitUntil:
    visible:
      id: "interview-screen"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "answer-input"
    timeout: 45000
