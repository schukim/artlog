# 플로우 4 — ISSUE-020 배포본 검증: 무효 답변(부정/회피/무응답)이 실제로
# 이 경로를 지날 때 a182c57 프롬프트 규칙(유효 턴 판별·분량연동·논지제약)대로
# 처리되는지 확인한다.
#
# interview.yaml 을 그대로 재사용하지 않는다 — 턴마다 다른 답변이 필요해서다.
# 앞 2턴만 interview.yaml 에 위임해(거기 고정된 유효 답변 문장을 그대로 쓴다) 검색~확인~
# 인터뷰 진입 공통 구간을 타고, 뒤 4턴은 이 플로우에서 직접 서로 다른 무효 답변을
# 하나씩 순서대로 넣는다. 유효 2 + 무효 4 = 6문답으로 무료 플랜 상한과 맞춘다.
#
# TITLE 은 캐시에 있는 기존 작품("기생충") 그대로 둔다 — 웹서치 재호출을 피해
# 실행당 비용을 ₩3.5 수준으로 낮춘다(웹서치가 붙으면 ₩61 추가).
#
# Maestro 는 화면 전이까지만 본다. 평론 품질(내용) 판정은 저장 직후 아래 SQL로 한다:
#
#   select id, length(body) as chars,
#          created_at at time zone 'Asia/Seoul' as kst, body
#   from reviews
#   where user_id = (select id from auth.users where email='wjdxodn99@naver.com')
#   order by created_at desc limit 1;
#
# 합격 기준 (a182c57 프롬프트 조항과 1:1, ①은 자동 판정 가능·②~④는 본문을 1회 읽어 판정):
#   ① chars 가 200~400자 — 유효 턴 2개인데 400자를 넘으면 재료 없이 늘린 것
#   ② 무효 턴 주제어("아니야"/"모르겠어요"/"아쉬운"/"글쎄" 관련 내용)가 본문에
#      등장하지 않음 — 부재 서술("~는 기억에 남지 않았다" 등)도 실패로 센다
#   ③ 마찰 단락이 없음 — "아쉬운 건 없었어" 를 마찰 재료로 쓰면 실패
#   ④ 인터뷰어가 질문에 담아 제시한 작품 정보(감독·촬영 방식 등)를 사용자 감상처럼
#      서술하지 않음
#
# 이 플로우는 검증용이다 — 불합격이 나와도 프롬프트를 여기서 고치지 않는다.
# 별도 이슈로 열고, ISSUE-020 은 "프롬프트 수정 완료·배포 완료"로 닫는다.
appId: com.taewoo.tastic
---
- launchApp:
    clearState: true
- runFlow: login.yaml

# 앞 2턴 — 유효 답변(재료). interview.yaml 이 검색~작품 확인~인터뷰 진입까지 공통 처리한다.
- runFlow:
    file: interview.yaml
    env:
      TITLE: "기생충"
      ANSWERS_COUNT: 2

# 뒤 4턴 — 무효 답변을 하나씩 순서대로. 반복(repeat)으로 묶지 않는다 — 턴마다 문장이 다르다.
- extendedWaitUntil:
    visible:
      id: "answer-input"
    timeout: 45000
- tapOn:
    id: "answer-input"
- inputText: "그건 아니야"
- tapOn:
    id: "submit-answer-button"

- extendedWaitUntil:
    visible:
      id: "answer-input"
    timeout: 45000
- tapOn:
    id: "answer-input"
- inputText: "모르겠어요"
- tapOn:
    id: "submit-answer-button"

- extendedWaitUntil:
    visible:
      id: "answer-input"
    timeout: 45000
- tapOn:
    id: "answer-input"
- inputText: "아쉬운 건 없었어"
- tapOn:
    id: "submit-answer-button"

- extendedWaitUntil:
    visible:
      id: "answer-input"
    timeout: 45000
- tapOn:
    id: "answer-input"
- inputText: "글쎄"
- tapOn:
    id: "submit-answer-button"

# 멤버십·developer 플랜은 무료 상한(6문답)에 닿아도 자동 종료되지 않고
# '평론 미리보기 / 인터뷰 계속하기' 선택을 기다린다(무료 플랜은 곧장 평론 화면으로 간다).
# interview.yaml 의 동일 블록 참조 — 거기서는 ANSWERS_COUNT=2 라 뜨지 않았다.
- runFlow:
    when:
      visible:
        id: "preview-review-button"
    commands:
      - tapOn:
          id: "preview-review-button"
      - extendedWaitUntil:
          visible:
            id: "preview-finish-button"
          timeout: 90000
      - tapOn:
          id: "preview-finish-button"

# 6번째 답변과 동시에(또는 미리보기 완료와 동시에) 평론 화면으로 넘어가 자동 생성이 시작된다.
- extendedWaitUntil:
    visible:
      id: "review-complete-screen"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "review-body-input"
    timeout: 90000

- tapOn:
    id: "save-review-button"

# 저장이 끝나면 홈으로 돌아간다 — 여기서부터는 위 SQL 로 판정한다.
- extendedWaitUntil:
    visible:
      id: "review-home-screen"
    timeout: 30000
- assertNotVisible:
    id: "unfinished-review-card"
