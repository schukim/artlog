# 플로우 1 — 정상 경로: 인터뷰를 마치고 평론을 저장한다.
# 이 앱의 심장이고, 여기가 깨지면 제품이 없는 것이나 마찬가지다.
appId: com.taewoo.tastic
---
- launchApp:
    clearState: true
- runFlow: login.yaml
- runFlow:
    file: interview.yaml
    env:
      TITLE: "기생충"
      ANSWERS_COUNT: 6

# 6번째 답변과 동시에 평론 화면으로 넘어가 자동 생성이 시작된다.
- extendedWaitUntil:
    visible:
      id: "review-complete-screen"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "review-body-input"
    timeout: 90000

- tapOn:
    id: "save-review-button"

# 저장이 끝나면 홈으로 돌아간다.
- extendedWaitUntil:
    visible:
      id: "review-home-screen"
    timeout: 30000
# 저장에 성공했으면 복구 카드가 남지 않아야 한다.
- assertNotVisible:
    id: "unfinished-review-card"
