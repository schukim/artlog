# 로그인 서브플로우 — 다른 플로우들이 runFlow 로 불러 쓴다.
#
# 계정 정보는 코드에 넣지 않는다. 실행 시 환경변수로 주입한다:
#   maestro test -e E2E_EMAIL=... -e E2E_PASSWORD=... .maestro/<flow>.yaml
# 반복 실행이 편하도록 .maestro/.env 에 넣어두고 아래처럼 불러도 된다(이 파일은 gitignore):
#   set -a; . .maestro/.env; set +a
#   maestro test -e E2E_EMAIL="$E2E_EMAIL" -e E2E_PASSWORD="$E2E_PASSWORD" .maestro/<flow>.yaml
appId: com.taewoo.tastic
---
# 첫 설치 상태면 인트로 투어를 먼저 넘긴다. 이미 봤다면 이 블록은 건너뛴다.
- runFlow:
    when:
      visible:
        id: "intro-tour-screen"
    commands:
      - repeat:
          times: 3
          commands:
            - tapOn:
                id: "intro-next-button"

- assertVisible:
    id: "login-screen"

- tapOn:
    id: "login-email-input"
- inputText: ${E2E_EMAIL}

- tapOn:
    id: "login-password-input"
- inputText: ${E2E_PASSWORD}

- hideKeyboard
- tapOn:
    id: "login-submit-button"

# 로그인 후 평론(홈) 탭이 뜬다. 인증 왕복이 있어 넉넉히 기다린다.
- extendedWaitUntil:
    visible:
      id: "review-home-screen"
    timeout: 30000
