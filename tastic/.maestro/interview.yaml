# 인터뷰 서브플로우 — 작품 검색부터 평론 생성 화면 진입까지.
# 세 본 플로우가 공통으로 여기를 지난다.
#
# 파라미터: TITLE(작품 제목), ANSWERS_COUNT(답변 횟수, 기본 6 = 무료 플랜 상한)
#
# 주의: 이 구간은 실제 LLM 을 호출한다(작품 검색 1회 + 질문 5회 + 평론 1회).
# 캐시에 있는 작품을 쓰면 검색 비용은 0 이 된다 — TITLE 기본값이 그래서 기존 작품이다.
appId: com.taewoo.tastic
# 서브플로우 — 단독 실행 대상이 아니다(npm run e2e 에서 제외된다).
tags:
  - subflow
---
- assertVisible:
    id: "review-home-screen"

# 홈은 진입 직후 비동기로 내용이 더 붙는다(복구 카드·드래프트 배너·그레이스 배너).
# 그것들이 나중에 삽입되면서 레이아웃이 아래로 밀리는데, 그 전에 탭하면 좌표가 어긋나
# 엉뚱한 버튼이 눌린다(실측: 카테고리 칩을 눌렀는데 복구 카드의 버튼이 눌렸다).
- waitForAnimationToEnd:
    timeout: 8000

# 복구 카드·배너가 붙으면 폼이 접혀 아래로 밀린다 — 칩이 보일 때까지 스크롤한다.
- scrollUntilVisible:
    element:
      id: "category-chip-movie"
    direction: DOWN
    timeout: 10000

# 카테고리를 먼저 고른다 — handleSelectCategory 가 입력 폼을 펼치면서
# 제목을 초기화(setTitle(""))하므로, 제목을 먼저 넣으면 지워진다.
- tapOn:
    id: "category-chip-movie"

- scrollUntilVisible:
    element:
      id: "review-title-input"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "review-title-input"
- inputText: ${TITLE}
# 키보드 닫기 — iOS 에서 hideKeyboard 는 불안정하다고 Maestro 가 경고한다.
# 대신 홈 화면의 인사말(정적 텍스트)을 탭한다.
- tapOn:
    id: "review-greeting"

- tapOn:
    id: "review-next-button"

# 작품 확인 — 웹서치 또는 캐시 조회. 웹서치면 최대 30초 걸린다.
- extendedWaitUntil:
    visible:
      id: "content-confirm-screen"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "content-candidate-0"
    timeout: 45000
- tapOn:
    id: "content-candidate-0"
- tapOn:
    id: "confirm-next-button"

# 인터뷰 — 첫 질문이 뜰 때까지 기다린 뒤 정해진 횟수만큼 답한다.
- extendedWaitUntil:
    visible:
      id: "interview-screen"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "answer-input"
    timeout: 45000

- repeat:
    times: ${ANSWERS_COUNT}
    commands:
      - extendedWaitUntil:
          visible:
            id: "answer-input"
          timeout: 45000
      - tapOn:
          id: "answer-input"
      - inputText: "E2E 자동 답변입니다. 공간의 대비가 인상 깊었고, 인물의 선택이 이해되면서도 불편했습니다."
      - tapOn:
          id: "submit-answer-button"

# 멤버십·developer 플랜은 무료 상한(6문답)에 닿으면 자동 종료되지 않고
# '평론 미리보기 / 인터뷰 계속하기' 선택을 기다린다(무료 플랜은 곧장 평론 화면으로 간다).
# 두 경로 모두에서 돌아야 하므로 선택지가 떴을 때만 미리보기를 누른다.
- runFlow:
    when:
      visible:
        id: "preview-review-button"
    commands:
      - tapOn:
          id: "preview-review-button"
      # 미리보기는 모달로 뜬다 — 생성이 끝나기를 기다렸다가 '이 평론으로 완성하기'.
      - extendedWaitUntil:
          visible:
            id: "preview-finish-button"
          timeout: 90000
      - tapOn:
          id: "preview-finish-button"
